<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>News'Cool | 쿨리가 간다</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root{
    --mint: #00C565;
    --mint-dark: #009E51;
    --mint-soft: #D9F6E9;
    --bg: #F3FBF6;
    --card: #FFFFFF;
    --ink: #1B2A41;
    --ink-soft: #5B6B7F;
    --coral: #FEA02F;
    --coral-soft: #FFF1E0;
    --yellow: #FFC94D;
    --yellow-soft: #FFF3D6;
    --green: #1FAE72;
    --green-soft: #DFF6EA;
    --red: #FF5C5C;
    --red-soft: #FFE3E3;
    --radius-lg: 26px;
    --radius-md: 18px;
    --shadow: 0 10px 30px rgba(0,197,101,0.12);
    --font-scale: 1;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 6% 10%, #DFF7E9 0%, transparent 42%),
      radial-gradient(circle at 94% 88%, #FFF1DC 0%, transparent 45%),

  }
  .app{ max-width:760px; margin:0 auto; padding:18px 16px 60px; }

  /* ---------- Header ---------- */
  .header{
    display:flex; align-items:center; gap:12px;
    padding:14px 18px;
    background:var(--card);
    border-radius:24px;
    box-shadow:var(--shadow);
    margin-bottom:14px;
    border:1px solid var(--mint-soft);
  }
  .logo-img{ flex:0 0 auto; height:38px; width:auto; object-fit:contain; cursor:pointer; }
  .header-text{flex:1;min-width:0;}
  .series{ font-size:20px; color:var(--ink); font-weight:800; }
  .fontctrl{ display:flex; gap:6px; flex:0 0 auto; }
  .fontctrl button{
    width:34px;height:34px; border-radius:12px; border:none;
    background:var(--mint-soft); color:var(--mint-dark);
    font-weight:700; font-size:14px; cursor:pointer;
  }
  .fontctrl button:active{transform:scale(0.92);}

  /* ---------- Home ---------- */
  .home-title{
    font-size:22px; font-weight:800; margin:6px 4px 4px;
  }
  .home-sub{
    font-size:14px; color:var(--ink-soft); margin:0 4px 14px;
  }
  .search-box{
    display:flex; align-items:center; gap:8px;
    background:var(--card);
    border:1px solid var(--mint-soft);
    border-radius:16px;
    padding:12px 16px;
    margin-bottom:12px;
    box-shadow:var(--shadow);
  }
  .search-box input{
    flex:1; border:none; outline:none; background:transparent;
    font-family:'Pretendard','Noto Sans KR',sans-serif;
    font-size:15px; color:var(--ink);
  }
  .search-box input::placeholder{ color:#A9B4C2; }
  .filter-chips{
    display:flex; gap:8px; overflow-x:auto;
    padding-bottom:4px; margin-bottom:16px;
    -ms-overflow-style:none; scrollbar-width:none;
  }
  .filter-chips::-webkit-scrollbar{ display:none; }
  .chip{
    flex:0 0 auto;
    padding:9px 16px;
    border-radius:100px;
    border:1.5px solid var(--mint-soft);
    background:var(--card);
    color:var(--ink-soft);
    font-weight:700; font-size:13.5px;
    cursor:pointer; white-space:nowrap;
  }
  .chip.active{
    background:var(--mint); border-color:var(--mint); color:white;
  }
  .empty-msg{
    text-align:center; color:var(--ink-soft);
    font-size:14.5px; padding:30px 10px;
  }
  .more-btn{
    width:100%; padding:14px; margin-top:4px;
    border:1.5px dashed var(--mint); border-radius:16px;
    background:var(--mint-soft); color:var(--mint-dark);
    font-weight:800; font-size:14.5px; cursor:pointer;
  }
  .more-btn:active{ transform:scale(0.98); }
  .article-card{
    display:flex; align-items:center; gap:14px;
    background:var(--card);
    border:1px solid var(--mint-soft);
    border-radius:22px;
    padding:16px 16px;
    margin-bottom:12px;
    box-shadow:var(--shadow);
    cursor:pointer;
    transition:transform .12s ease;
  }
  .article-card:active{ transform:scale(0.98); }
  .article-thumb{
    flex:0 0 auto;
    width:56px;height:56px;
    border-radius:16px;
    display:flex;align-items:center;justify-content:center;
    font-size:26px;
    background:linear-gradient(150deg, var(--mint), var(--mint-dark));
    color:white;
  }
  .article-info{ flex:1; min-width:0; }
  .article-keyword{
    display:inline-block;
    font-size:11.5px; font-weight:800; color:var(--mint-dark);
    background:var(--mint-soft);
    padding:2px 9px; border-radius:100px; margin-bottom:6px;
  }
  .article-card-title{
    font-size:15.5px; font-weight:700; color:var(--ink);
    line-height:1.4;
    margin-bottom:4px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .article-date{ font-size:12px; color:var(--ink-soft); }
  .article-arrow{ flex:0 0 auto; font-size:20px; color:var(--coral); }
  .done-badge{
    flex:0 0 auto;
    background:var(--green-soft);
    color:var(--green);
    font-size:11px;
    font-weight:800;
    padding:3px 9px;
    border-radius:100px;
    margin-left:6px;
  }
  .progress-bar{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--card);
    border:1px solid var(--mint-soft);
    border-radius:16px;
    padding:12px 16px;
    margin-bottom:12px;
    box-shadow:var(--shadow);
    font-size:13.5px;
    color:var(--ink-soft);
  }
  .progress-bar b{ color:var(--mint-dark); }
  .reset-link{
    background:none; border:none;
    color:var(--ink-soft);
    font-size:12px;
    text-decoration:underline;
    cursor:pointer;
  }

  /* ---------- Views ---------- */
  .view{display:none;} .view.active{display:block;}

  .back-row{
    display:flex; align-items:center; gap:8px;
    margin-bottom:12px;
  }
  .back-btn{
    display:flex; align-items:center; gap:6px;
    background:var(--card);
    border:1px solid var(--mint-soft);
    color:var(--mint-dark);
    font-weight:700; font-size:14px;
    padding:9px 14px; border-radius:100px;
    cursor:pointer;
    box-shadow:var(--shadow);
  }
  .back-btn:active{ transform:scale(0.96); }

  /* ---------- Keyword badge ---------- */
  .keyword-badge{
    display:flex; align-items:center; gap:10px;
    background:linear-gradient(120deg, var(--mint), var(--mint-dark));
    color:white; padding:14px 18px; border-radius:22px;
    margin-bottom:14px; box-shadow:var(--shadow);
  }
  .keyword-badge .tag{
    font-size:12px; background:rgba(255,255,255,0.25);
    padding:4px 10px; border-radius:100px; font-weight:700;
  }
  .keyword-badge .word{ font-size:24px; font-weight:800; }
  .mascot-avatar{
    width:52px;height:52px;
    border-radius:50%;
    object-fit:cover;
    background:white;
    flex:0 0 auto;
    box-shadow:0 4px 10px rgba(0,0,0,0.15);
  }

  /* ---------- Tabs ---------- */
  .tabs{
    display:flex; gap:8px; background:var(--card);
    padding:6px; border-radius:18px; box-shadow:var(--shadow);
    margin-bottom:16px; border:1px solid var(--mint-soft);
  }
  .tab{
    flex:1; text-align:center; padding:13px 8px; border-radius:14px;
    font-weight:700; font-size:15.5px; color:var(--ink-soft);
    background:transparent; border:none; cursor:pointer; transition:all .15s ease;
  }
  .tab.active{
    background:var(--mint); color:white;
    box-shadow:0 6px 14px rgba(0,197,101,0.35);
  }
  .tab .icon{margin-right:6px;}

  /* ---------- Cards ---------- */
  .card{
    background:var(--card); border-radius:var(--radius-lg); box-shadow:var(--shadow);
    padding:22px 20px; margin-bottom:16px; border:1px solid var(--mint-soft);
  }
  .article-title{ font-size:calc(23px * var(--font-scale)); font-weight:800; color:var(--ink); margin:0 0 4px; }
  .article-sub{ font-size:calc(13px * var(--font-scale)); color:var(--mint-dark); font-weight:700; margin-bottom:16px; }
  .hint-bar{
    display:flex; align-items:center; gap:8px;
    background:var(--yellow-soft); color:#8A5A00;
    font-size:13px; font-weight:600; padding:10px 14px; border-radius:14px; margin-bottom:18px;
  }
  p.article-p{
    font-size:calc(17.5px * var(--font-scale)); line-height:1.85; color:var(--ink); margin:0 0 18px;
  }
  p.article-h{
    font-size:calc(17px * var(--font-scale)); font-weight:800; color:var(--mint-dark); margin:0 0 8px;
  }
  .wd{
    background:linear-gradient(to top, var(--coral-soft) 45%, transparent 45%);
    color:var(--coral-dark, #C9711A); font-weight:700; padding:1px 2px; border-radius:4px;
    cursor:pointer; white-space:nowrap;
  }
  .wd:active{filter:brightness(0.95);}

  .qa-title{ font-size:calc(19px * var(--font-scale)); font-weight:800; margin:6px 0 12px; color:var(--mint-dark); }
  .summary-p{ font-size:calc(15.5px * var(--font-scale)); line-height:1.85; color:var(--ink-soft); margin:0 0 14px; }
  .think-list{ display:flex; flex-direction:column; gap:10px; }
  .think-item{
    display:flex; gap:12px; align-items:flex-start;
    background:var(--yellow-soft);
    border-radius:16px;
    padding:14px 16px;
    font-size:calc(15px * var(--font-scale));
    line-height:1.6;
    color:var(--ink);
  }
  .think-num{
    flex:0 0 auto;
    width:24px;height:24px;
    border-radius:50%;
    background:var(--coral);
    color:white;
    font-size:12.5px;
    font-weight:800;
    display:flex;align-items:center;justify-content:center;
  }
  .related-cta{
    margin-top:26px;
    padding:18px 16px;
    border-radius:18px;
    background:linear-gradient(120deg, var(--mint-soft), var(--coral-soft));
    text-align:center;
  }
  .related-cta-text{
    font-size:14.5px;
    font-weight:800;
    color:var(--ink);
    margin-bottom:10px;
  }
  .related-cta-btn{
    display:inline-block;
    background:var(--mint);
    color:white;
    font-weight:800;
    font-size:14px;
    padding:11px 20px;
    border-radius:100px;
    text-decoration:none;
  }
  .related-cta-btn:active{ transform:scale(0.97); }
  .qa-item{ border:2px solid var(--mint-soft); border-radius:16px; margin-bottom:10px; overflow:hidden; }
  .qa-q{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    background:var(--mint-soft); border:none; padding:14px 16px;
    font-size:calc(15.5px * var(--font-scale)); font-weight:700; color:var(--ink); cursor:pointer;
  }
  .qa-q .q-mark{
    flex:0 0 auto; width:26px;height:26px; border-radius:50%;
    background:var(--mint); color:white; font-size:14px;
    display:flex;align-items:center;justify-content:center;
  }
  .qa-q .chevron{ margin-left:auto; transition:transform .2s ease; color:var(--mint-dark); }
  .qa-item.open .chevron{transform:rotate(180deg);}
  .qa-a{ max-height:0; overflow:hidden; transition:max-height .25s ease; background:white; }
  .qa-a-inner{ padding:14px 16px 18px; font-size:calc(15.5px * var(--font-scale)); line-height:1.8; color:var(--ink-soft); }

  /* ---------- Quiz ---------- */
  .quiz-progress{ font-size:13px; color:var(--mint-dark); font-weight:800; margin-bottom:8px; }
  .quiz-q{ font-size:calc(19px * var(--font-scale)); font-weight:800; line-height:1.5; margin-bottom:18px; color:var(--ink); }
  .opt{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    background:#F4FAF9; border:2px solid transparent; border-radius:16px; padding:15px 16px;
    margin-bottom:10px; font-size:calc(15.5px * var(--font-scale)); color:var(--ink);
    cursor:pointer; transition:all .15s ease;
  }
  .opt .num{
    flex:0 0 auto; width:28px;height:28px; border-radius:50%; background:white;
    border:2px solid #CFE9E5; display:flex;align-items:center;justify-content:center;
    font-weight:700; font-size:13px; color:var(--mint-dark);
  }
  .opt:active{transform:scale(0.99);}
  .opt.correct{background:var(--green-soft);border-color:var(--green);}
  .opt.correct .num{background:var(--green);border-color:var(--green);color:white;}
  .opt.wrong{background:var(--red-soft);border-color:var(--red);}
  .opt.wrong .num{background:var(--red);border-color:var(--red);color:white;}
  .opt.disabled{cursor:default;}

  .feedback{ display:none; margin-top:14px; padding:16px 18px; border-radius:16px; font-size:calc(15px * var(--font-scale)); line-height:1.75; }
  .feedback.show{display:block;}
  .feedback.ok{background:var(--green-soft);color:#0E7A4F;}
  .feedback.no{background:var(--red-soft);color:#B5312F;}
  .feedback .ftitle{ font-weight:800; font-size:calc(17px * var(--font-scale)); margin-bottom:6px; display:flex;align-items:center;gap:6px; }
  .retry-btn{
    display:none; margin-top:16px; width:100%; padding:15px; border:none; border-radius:16px;
    background:var(--coral); color:white; font-weight:800; font-size:15.5px; cursor:pointer;
  }
  .retry-btn.show{display:block;}
  .goquiz-btn{
    width:100%; padding:15px; border:none; border-radius:16px;
    background:var(--mint); color:white; font-weight:800; font-size:15.5px; cursor:pointer;
    margin-top:4px;
  }

  /* ---------- Bottom sheet dictionary ---------- */
  .sheet-overlay{ position:fixed; inset:0; background:rgba(18,42,65,0.35); opacity:0; pointer-events:none; transition:opacity .2s ease; z-index:40; }
  .sheet-overlay.show{opacity:1;pointer-events:auto;}
  .sheet{
    position:fixed; left:0;right:0;bottom:0; max-width:760px; margin:0 auto;
    background:var(--card); border-radius:26px 26px 0 0; box-shadow:0 -10px 40px rgba(18,42,65,0.25);
    transform:translateY(110%); transition:transform .28s cubic-bezier(.2,.9,.3,1.2);
    z-index:41; padding:10px 22px 28px;
  }
  .sheet.show{transform:translateY(0);}
  .sheet-handle{ width:44px;height:5px; background:#E1E5EC; border-radius:10px; margin:6px auto 16px; }
  .sheet-head{ display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  .sheet-icon{
    width:44px;height:44px; border-radius:14px; background:var(--mint-soft);
    display:flex;align-items:center;justify-content:center; font-size:22px; flex:0 0 auto;
  }
  .sheet-word{ font-size:21px; font-weight:800; color:var(--coral-dark,#C9711A); }
  .sheet-label{ font-size:12px; color:var(--mint-dark); font-weight:700; }
  .sheet-def{ font-size:16px; line-height:1.8; color:var(--ink); background:#F5FAF9; padding:14px 16px; border-radius:16px; }
  .sheet-close{
    width:100%; margin-top:16px; padding:14px; border:none; border-radius:16px;
    background:var(--ink); color:white; font-weight:800; font-size:15px; cursor:pointer;
  }

  .done-card{ text-align:center; padding:10px 6px 4px; }

      explanationOk: "기사에는 스마트폰 사용에 대한 '권고'와 학생의 학교 내 사용 금지는 나오지만, 부모에게 벌금을 부과한다는 내용은 없어.",
      explanationNo: "정답은 ②번이야. 기사에는 스마트폰 사용에 대한 '권고'와 학생의 학교 내 사용 금지는 나오지만, 부모에게 벌금을 부과한다는 내용은 없어."
    }
  },
];

/* =========================================================
   내 기기 기록 (localStorage: 이 브라우저에만 저장, 다른 기기와 공유되지 않음)
========================================================= */
const PROGRESS_KEY = "newscool_solved_articles";

function getSolvedSet(){
  try{
    const raw = localStorage.getItem(PROGRESS_KEY);
    return raw ? new Set(JSON.parse(raw)) : new Set();
  }catch(e){
    return new Set(); // localStorage 사용 불가 환경(개인정보 보호 모드 등) 대비
  }
}

function markSolved(articleId){
  try{
    const s = getSolvedSet();
    s.add(articleId);
    localStorage.setItem(PROGRESS_KEY, JSON.stringify([...s]));
  }catch(e){ /* 저장 실패해도 앱은 계속 동작 */ }
  updateProgressCount();
}

function updateProgressCount(){
  const el = document.getElementById('progressCount');
  if(el) el.textContent = getSolvedSet().size;
}

function resetProgress(){
  if(!confirm('이 기기에 저장된 내 퀴즈 완료 기록을 모두 지울까요?')) return;
  try{ localStorage.removeItem(PROGRESS_KEY); }catch(e){}
  updateProgressCount();
  renderHome();
}

/* =========================================================
   상태 & 렌더링 (홈: 검색 / 키워드 필터 / 더보기 페이지네이션)
========================================================= */
let currentArticleId = null;
const PAGE_SIZE = 10;
let homeState = { search: "", filter: "전체", page: 1 };

// 최신순 정렬 (date: "YYYY.MM.DD")
const sortedArticles = [...articles].sort((a,b) => b.date.localeCompare(a.date));

function getFilteredArticles(){
  const kw = homeState.search.trim().toLowerCase();
  return sortedArticles.filter(a => {
    const matchFilter = (homeState.filter === "전체") || (a.category === homeState.filter);
    const matchSearch = !kw || a.title.toLowerCase().includes(kw) || a.keyword.toLowerCase().includes(kw);
    return matchFilter && matchSearch;
  });
}

function renderChips(){
  const uniqueCategories = [...new Set(sortedArticles.map(a => a.category))];
  const chips = ["전체", ...uniqueCategories];
  const box = document.getElementById('filterChips');
  box.innerHTML = chips.map(c => `
    <button class="chip ${c === homeState.filter ? 'active' : ''}" data-chip="${c}">${c}</button>
  `).join('');
  box.querySelectorAll('.chip').forEach(btn => {
    btn.addEventListener('click', () => {
      homeState.filter = btn.dataset.chip;
      homeState.page = 1;
      renderChips();
      renderHome();
    });
  });
}

function renderHome(){
  const filtered = getFilteredArticles();
  const visible = filtered.slice(0, homeState.page * PAGE_SIZE);
  const list = document.getElementById('homeList');
  const moreBtn = document.getElementById('moreBtn');
  const solvedSet = getSolvedSet();

  if(filtered.length === 0){
    list.innerHTML = `<div class="empty-msg">🔎 조건에 맞는 기사를 찾지 못했어요.<br>다른 검색어나 키워드로 찾아볼까요?</div>`;
    moreBtn.style.display = 'none';
    return;
  }

  list.innerHTML = visible.map(a => `
    <div class="article-card" onclick="openArticle('${a.id}')">
      <div class="article-thumb">${a.thumb}</div>
      <div class="article-info">
        <span class="article-keyword">${a.keyword}</span>
        ${solvedSet.has(a.id) ? '<span class="done-badge">✅ 완료</span>' : ''}
        <div class="article-card-title">${a.title}</div>
        <div class="article-date">${a.date}</div>
      </div>
      <div class="article-arrow">›</div>
    </div>
  `).join('');

  moreBtn.style.display = (visible.length < filtered.length) ? 'block' : 'none';
  updateProgressCount();
}

function loadMore(){
  homeState.page += 1;
  renderHome();
}

document.getElementById('searchInput').addEventListener('input', (e) => {
  homeState.search = e.target.value;
  homeState.page = 1;
  renderHome();
});

function openArticle(id){
  currentArticleId = id;
  const a = articles.find(x => x.id === id);
  document.getElementById('artKeywordWord').textContent = a.keyword;

  const readCard = document.getElementById('readCard');
  const tabsEl = document.querySelector('.tabs');
  const goQuizBtn = document.querySelector('.goquiz-btn');

  if(a.type === 'link'){
    // 원문 링크형: 본문 전체를 복제하지 않고, 요약과 원문 링크만 제공
    tabsEl.style.display = 'none';
    goQuizBtn.style.display = 'none';
    readCard.innerHTML = `
      <div class="article-title">${a.title}</div>
      <div class="article-sub">뉴스 키워드: ${a.keyword}</div>
      <p class="article-p" style="color:var(--ink-soft);">${a.teaser}</p>
      <div class="hint-bar">📌 이 기사는 아직 뉴스쿨 앱 안에서 전체 내용을 준비 중이에요. 아래 버튼으로 원문을 확인해보세요!</div>
      <a class="goquiz-btn" style="display:block; text-align:center; text-decoration:none; background:var(--coral);" href="${a.url}" target="_blank" rel="noopener">🔗 뉴스쿨에서 전체 기사 읽기</a>
    `;
  } else {
    tabsEl.style.display = 'flex';
    goQuizBtn.style.display = 'block';
    readCard.innerHTML = `
      <div class="article-title">${a.title}</div>
      <div class="article-sub">뉴스 키워드: ${a.keyword}</div>
      <div class="hint-bar">👆 색칠된 단어를 톡 누르면 뜻을 알려줘요!</div>
      ${a.body}
      <div class="qa-title" style="margin-top:26px;">✏️ ${a.summaryTitle}</div>
      ${a.summary}
      <div class="qa-title">🙋 뉴스 Q&A</div>
      ${a.qa.map((item,i) => `
        <div class="qa-item">
          <button class="qa-q" onclick="toggleQA(this)">
            <span class="q-mark">Q</span>${item.q}<span class="chevron">▾</span>
          </button>
          <div class="qa-a"><div class="qa-a-inner">${item.a}</div></div>
        </div>
      `).join('')}
      ${(a.relatedIssue || a.relatedIssue2) ? `
        <div class="related-cta" style="margin-top:16px;">
          <div class="related-cta-text">📬 이 기사와 연관된 뉴스쿨 콘텐츠</div>
          ${a.relatedIssue ? `<a class="related-cta-btn" style="display:block;margin-bottom:8px;" href="${a.relatedIssue.url}" target="_blank" rel="noopener">${a.relatedIssue.title}</a>` : ''}
          ${a.relatedIssue2 ? `<a class="related-cta-btn" style="display:block;" href="${a.relatedIssue2.url}" target="_blank" rel="noopener">${a.relatedIssue2.title}</a>` : ''}
        </div>
      ` : ''}
      ${a.think ? `
        <div class="qa-title" style="margin-top:26px;">🤔 생각 더하기</div>
        <div class="think-list">
          ${a.think.map((q,i) => `
            <div class="think-item"><span class="think-num">${i+1}</span>${q}</div>
          `).join('')}
        </div>
      ` : ''}
    `;
  }
  bindWordTaps(readCard);

  document.getElementById('view-home').classList.remove('active');
  document.getElementById('view-article').classList.add('active');
  switchSub('read');
  if(a.type === 'full') renderQuiz();
  window.scrollTo({top:0, behavior:'smooth'});
}

function goHome(){
  document.getElementById('view-article').classList.remove('active');
  document.getElementById('view-home').classList.add('active');
  window.scrollTo({top:0, behavior:'smooth'});
}

function switchSub(name){
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.sub === name));
  document.getElementById('sub-read').style.display = (name === 'read') ? 'block' : 'none';
  document.getElementById('sub-quiz').style.display = (name === 'quiz') ? 'block' : 'none';
  window.scrollTo({top:0, behavior:'smooth'});
}
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => switchSub(t.dataset.sub)));

function renderQuiz(){
  const a = articles.find(x => x.id === currentArticleId);
  const q = a.quiz;
  document.getElementById('doneCard').style.display = 'none';
  const body = document.getElementById('quizBody');
  body.style.display = 'block';
  body.innerHTML = `
    <div class="quiz-progress">문제 1 / 1</div>
    <div class="quiz-q">${q.question}</div>
    ${q.options.map((opt,i) => `
      <button class="opt" data-idx="${i}">
        <span class="num">${i+1}</span>${opt}
      </button>
    `).join('')}
    <div class="feedback" id="feedback"></div>
    <button class="retry-btn" id="retryBtn" onclick="renderQuiz()">🔄 다시 풀어보기</button>
  `;

  const opts = body.querySelectorAll('.opt');
  const feedback = document.getElementById('feedback');
  const retryBtn = document.getElementById('retryBtn');
  let answered = false;

  opts.forEach(opt => {
    opt.addEventListener('click', () => {
      if(answered) return;
      answered = true;
      const idx = parseInt(opt.dataset.idx, 10);
      const isCorrect = idx === q.correct;
      opts.forEach(o => {
        o.classList.add('disabled');
        if(parseInt(o.dataset.idx,10) === q.correct) o.classList.add('correct');
      });
      if(!isCorrect) opt.classList.add('wrong');

      feedback.classList.add('show', isCorrect ? 'ok' : 'no');
      feedback.innerHTML = isCorrect
        ? `<div class="ftitle">🙆 정답이에요!</div>${q.explanationOk}`
        : `<div class="ftitle">🙅 아쉬워요!</div>${q.explanationNo}`;

      retryBtn.classList.add('show');

      if(isCorrect){
        markSolved(currentArticleId);
        setTimeout(() => {
          body.style.display = 'none';
          document.getElementById('doneCard').style.display = 'block';
        }, 1400);
      }
    });
  });
}

/* ---------- 단어 사전 바텀시트 ---------- */
const sheet = document.getElementById('sheet');
const overlay = document.getElementById('overlay');
function bindWordTaps(root){
  root.querySelectorAll('.wd').forEach(el => {
    el.addEventListener('click', () => {
      const w = el.dataset.word;
      document.getElementById('sheetWord').textContent = w;
      document.getElementById('sheetDef').textContent = dict[w] || "아직 준비 중인 단어예요.";
      sheet.classList.add('show');
      overlay.classList.add('show');
    });
  });
}
function closeSheet(){
  sheet.classList.remove('show');
  overlay.classList.remove('show');
}
overlay.addEventListener('click', closeSheet);

/* ---------- Q&A 아코디언 ---------- */
function toggleQA(btn){
  const item = btn.closest('.qa-item');
  const ans = item.querySelector('.qa-a');
  const isOpen = item.classList.contains('open');
  item.parentElement.querySelectorAll('.qa-item').forEach(i => {
    i.classList.remove('open');
    i.querySelector('.qa-a').style.maxHeight = null;
  });
  if(!isOpen){
    item.classList.add('open');
    ans.style.maxHeight = ans.scrollHeight + 40 + 'px';
  }
}

/* ---------- 폰트 크기 조절 ---------- */
let scale = 1;
const root = document.documentElement;
document.getElementById('fontPlus').onclick = () => {
  scale = Math.min(1.3, scale + 0.1);
  root.style.setProperty('--font-scale', scale);
};
document.getElementById('fontMinus').onclick = () => {
  scale = Math.max(0.85, scale - 0.1);
  root.style.setProperty('--font-scale', scale);
};
document.getElementById('logoBtn').addEventListener('click', goHome);

/* ---------- 초기 렌더 ---------- */
renderChips();
renderHome();
</script>
</body>
</html>
